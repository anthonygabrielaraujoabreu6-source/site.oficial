<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial;
  background: linear-gradient(135deg, #2b004f, #6a00a3);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

nav {
  position: fixed;
  width: 100%;
  top: 0;
  left: 0;
  background: rgba(0,0,0,0.4);
  padding: 12px;
  backdrop-filter: blur(10px);
  z-index: 10;
}

nav a {
  color: white;
  margin: 0 10px;
  text-decoration: none;
  font-size: 14px;
}

section {
  min-height: 100vh;
  padding: 90px 10px 40px;
}

.media-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 10px;
}

.media-grid img,
.media-grid video {
  width: 100%;
  height: 190px;
  object-fit: cover;
  border-radius: 15px;
  background: black;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  padding: 10px;
}

.grid img {
  width: 100%;
  border-radius: 15px;
}

.card {
  background: rgba(255,255,255,0.1);
  padding: 20px;
  border-radius: 15px;
  max-width: 600px;
  margin: auto;
  backdrop-filter: blur(10px);
}

.music-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #ff2d75;
  border: none;
  border-radius: 50%;
  width: 60px;
  height: 60px;
  font-size: 20px;
  color: white;
  cursor: pointer;
}

.heart {
  position: fixed;
  bottom: 0;
  animation: subir 5s linear infinite;
}

@keyframes subir {
  0% { transform: translateY(0); opacity:1; }
  100% { transform: translateY(-100vh); opacity:0; }
}
</style>
</head>

<button class="music-btn" onclick="toggleMusic()" id="btn">▶</button>

<script>
// 🔥 BLOQUEIA AUTOFILL E LIMPA SENHA
window.addEventListener("load", () => {
  const campo = document.getElementById("senha");
  campo.value = "";

  campo.setAttribute("readonly", true);
  setTimeout(() => {
    campo.removeAttribute("readonly");
  }, 100);
});

const audio = new Audio("music.mp3");

const inicio = 1;
const fim = 90;

const btn = document.getElementById("btn");

function toggleMusic() {
  if (audio.paused) {
    audio.currentTime = inicio;
    audio.play();
    btn.innerHTML = "⏸";
  } else {
    audio.pause();
    btn.innerHTML = "▶";
  }
}

audio.addEventListener("timeupdate", () => {
  if (audio.currentTime >= fim) {
    audio.pause();
    audio.currentTime = inicio;
    btn.innerHTML = "▶";
  }
});

function entrar() {
  const senha = document.getElementById("senha").value;

  if (senha === "2107") {
    document.getElementById("login").style.display = "none";
  } else {
    document.getElementById("erro").innerText = "errou pcr kkk";
  }
}
</script>
